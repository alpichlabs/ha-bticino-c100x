name: Integration release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: grep "\"version\": \"${GITHUB_REF_NAME#v}\"" custom_components/bticino_c100x/manifest.json
      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "BTicino C100X ${GITHUB_REF_NAME#v}" --generate-notes
