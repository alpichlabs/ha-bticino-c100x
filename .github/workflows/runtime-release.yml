name: Runtime release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build checksum-pinned amd64 runtime
        run: runtime/build-runtime.sh
      - name: Fetch corresponding Linphone SDK source
        run: |
          git clone --recursive https://github.com/BelledonneCommunications/linphone-sdk.git linphone-sdk-source
          git -C linphone-sdk-source checkout 6dde746d2f960d4281b353d864cca2e308a2eb50
          git -C linphone-sdk-source submodule update --init --recursive
          find linphone-sdk-source -name .git -prune -exec rm -rf {} +
          tar -czf linphone-sdk-6dde746d-source.tar.gz linphone-sdk-source
          sha256sum linphone-sdk-6dde746d-source.tar.gz > linphone-sdk-6dde746d-source.tar.gz.sha256
      - name: Publish immutable helper release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create runtime-v0.1.0 \
            bticino-c100x-linphone-0.1.0-linux-amd64.tar.gz \
            bticino-c100x-linphone-0.1.0-linux-amd64.tar.gz.sha256 \
            linphone-sdk-6dde746d-source.tar.gz \
            linphone-sdk-6dde746d-source.tar.gz.sha256 \
            --title 'Linphone runtime 0.1.0' \
            --notes 'GPLv3 amd64 helper. Built from checksum-pinned CPython 3.9 and the official Linphone 5.4.0 Python distribution. Corresponding Linphone SDK source and checksums are attached.'
