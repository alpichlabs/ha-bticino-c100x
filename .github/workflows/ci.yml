name: CI

on:
  push:
  pull_request:

jobs:
  test-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests
      - run: pytest -q
      - run: RUN_FFMPEG_SRTP_SMOKE=1 pytest -q tests/test_ffmpeg_smoke.py
      - run: node --check custom_components/bticino_c100x/frontend/bticino-c100x-card.js
