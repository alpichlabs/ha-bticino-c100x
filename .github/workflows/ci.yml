name: CI

on:
  push:
  pull_request:

jobs:
  test-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components runtime tests
      - run: pytest -q

  test-amd64-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime from pinned inputs
        run: runtime/build-runtime.sh
      - name: Run credential-free IPC smoke test
        run: |
          if ! output=$(python3 runtime/smoke-test.py bticino-c100x-linphone-0.1.0-linux-amd64.tar.gz "$(cut -d ' ' -f 1 bticino-c100x-linphone-0.1.0-linux-amd64.tar.gz.sha256)" 2>&1); then
            echo "::error title=Linphone runtime smoke test::$output"
            exit 1
          fi
          echo "$output"
